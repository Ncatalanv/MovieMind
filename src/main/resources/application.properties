spring.application.name=moviemind

# Conexion a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/moviemind?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
#update --> para actualizar la base de datos en caso de que haya un cambio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Open-Meteo API (clima, sin API key)
openmeteo.base-url=https://api.open-meteo.com
imdb.base-url=https://api.imdbapi.dev