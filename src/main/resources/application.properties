spring.application.name=moviemind
server.port=${PORT:8080}

# Conexion a MySQL local
spring.datasource.url=${DB_URL}
#jdbc:mysql://localhost:3306/moviemind?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
#root
spring.datasource.password=${DB_PASSWORD}
#1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
#update --> para actualizar la base de datos en caso de que haya un cambio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-Meteo API (clima, sin API key)
openmeteo.base-url=${OPENMETEO_BASE_URL}
#https://api.open-meteo.com
imdb.base-url=${IMDB_BASE_URL}
#https://api.imdbapi.dev

# Spring Security - JWT
# IMPORTANTE: cambia este valor en produccion por uno aleatorio largo (min 32 caracteres)
jwt.secret=${JWT_SECRET}
#moviemind-clave-secreta-jwt-2026-cambiar-en-produccion

# Evita conflicto conocido entre springdoc y HATEOAS en esta combinacion de versiones
springdoc.enable-hateoas=false