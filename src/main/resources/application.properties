spring.application.name=moviemind

# Conexion a MySQL local
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
#update --> para actualizar la base de datos en caso de que haya un cambio
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Open-Meteo API (clima, sin API key)
openmeteo.base-url=https://api.open-meteo.com
imdb.base-url=https://api.imdbapi.dev

# Spring Security - JWT
# IMPORTANTE: cambia este valor en produccion por uno aleatorio largo (min 32 caracteres)
jwt.secret=bibliotecaduoc-clave-secreta-jwt-2026-cambiar-en-produccion